apiVersion: v1
kind: Namespace
metadata:
  name: drill-11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: drill-11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ghcr.io/shopsphere-does-not-exist/catalog:1.0.0
      imagePullSecrets:
        - name: missing-registry
