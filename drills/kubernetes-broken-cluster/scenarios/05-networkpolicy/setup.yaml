apiVersion: v1
kind: Namespace
metadata:
  name: drill-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: drill-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: drill-05
spec:
  selector:
    app: catalog
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: drill-05
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-catalog
  namespace: drill-05
spec:
  podSelector:
    matchLabels:
      app: catalog
  policyTypes:
    - Ingress
