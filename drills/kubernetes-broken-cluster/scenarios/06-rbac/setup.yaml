apiVersion: v1
kind: Namespace
metadata:
  name: drill-06
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: drill-06
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: drill-06
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader
  namespace: drill-06
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: drill-06
roleRef:
  kind: Role
  name: reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: catalog
  namespace: drill-06
spec:
  serviceAccountName: reader
  containers:
    - name: kubectl
      image: bitnami/kubectl:1.32.3
      command: ["sleep", "3600"]
