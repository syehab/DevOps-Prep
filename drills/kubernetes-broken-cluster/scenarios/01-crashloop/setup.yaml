apiVersion: v1
kind: Namespace
metadata:
  name: drill-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: drill-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["sh", "-c", "echo boom; exit 1"]
