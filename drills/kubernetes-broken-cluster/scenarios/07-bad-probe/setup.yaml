apiVersion: v1
kind: Namespace
metadata:
  name: drill-07
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: drill-07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz-does-not-exist
              port: 80
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: drill-07
spec:
  selector:
    app: catalog
  ports:
    - port: 80
      targetPort: 80
