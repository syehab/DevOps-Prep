apiVersion: v1
kind: Namespace
metadata:
  name: drill-03
---
apiVersion: v1
kind: Pod
metadata:
  name: stuck
  namespace: drill-03
spec:
  nodeSelector:
    disktype: ssd-does-not-exist
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "16"
          memory: 1Gi
