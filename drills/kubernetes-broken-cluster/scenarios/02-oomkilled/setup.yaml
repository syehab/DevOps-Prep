apiVersion: v1
kind: Namespace
metadata:
  name: drill-02
---
apiVersion: v1
kind: Pod
metadata:
  name: hog
  namespace: drill-02
spec:
  restartPolicy: Always
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sh", "-c", "dd if=/dev/zero of=/dev/shm/fill bs=1M count=64; sleep 3600"]
      resources:
        limits:
          memory: 16Mi
        requests:
          memory: 8Mi
