apiVersion: v1
kind: Namespace
metadata:
  name: drill-10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: drill-10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
  namespace: drill-10
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: catalog
