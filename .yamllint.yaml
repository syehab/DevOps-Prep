extends: default

rules:
  line-length:
    max: 140
    allow-non-breakable-inline-mappings: true
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  empty-lines:
    max: 2

ignore: |
  .git
  .terraform
  node_modules
